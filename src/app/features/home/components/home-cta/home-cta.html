  <!-- 7. استعراض النظام الفخم (Premium UI Showcase) -->
  <section class="relative bg-gradient-to-b from-white to-gray-50 pb-32 pt-20 z-20 overflow-hidden">
    
    <!-- Title -->
    <div class="text-center mb-8 md:mb-16 relative z-40" data-aos="fade-up">
      <h3 class="text-3xl md:text-4xl font-bold text-[#122056] mb-4">نظام متكامل، بتصميم يسابق الزمن</h3>
      <p class="text-gray-500 max-w-2xl mx-auto text-lg">شاشات ذكية مصممة خصيصاً لراحة عينيك وسرعة إنجاز مهام عيادتك.</p>
    </div>

    <!-- Floating UI Composition -->
    <div class="max-w-7xl mx-auto px-4 relative h-[250px] sm:h-[350px] md:h-[600px] flex justify-center items-center" style="perspective: 1000px;">
      
      <!-- Center Image (Main) -->
      <div class="absolute z-30 w-[80%] sm:w-[70%] md:w-[60%] animate-float group cursor-pointer transition-all duration-700 hover:scale-[1.02] hover:-translate-y-4 hover:z-50" style="animation-delay: 0s;">
        <div class="rounded-2xl md:rounded-3xl p-1 md:p-2 bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.2)] hover:shadow-[0_25px_50px_-12px_rgba(91,101,220,0.4)] transition-shadow duration-700">
          <div class="rounded-xl md:rounded-2xl overflow-hidden border border-gray-100/50 bg-white">
            <img src="/assets/images/Screenshot 2026-06-27 222129.png" alt="Dashboard View" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>

      <!-- Left Image -->
      <div class="absolute z-20 w-[55%] sm:w-[50%] md:w-[45%] left-0 sm:left-[2%] md:left-[5%] top-[10%] md:top-[15%] opacity-90 animate-float group cursor-pointer transition-all duration-700 hover:scale-105 hover:opacity-100 hover:z-50 -rotate-2 hover:rotate-0" style="animation-delay: 1.2s;">
        <div class="rounded-xl md:rounded-2xl p-1 md:p-2 bg-white/30 backdrop-blur-md border border-white/50 shadow-[0_15px_30px_-10px_rgba(0,0,0,0.15)] hover:shadow-[0_25px_50px_-12px_rgba(235,122,68,0.3)] transition-shadow duration-700">
          <div class="rounded-lg md:rounded-xl overflow-hidden border border-gray-100/50 bg-white">
            <img src="/assets/images/Screenshot 2026-06-27 222340.png" alt="System View" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>

      <!-- Right Image -->
      <div class="absolute z-20 w-[55%] sm:w-[50%] md:w-[45%] right-0 sm:right-[2%] md:right-[5%] top-[5%] md:top-[10%] opacity-90 animate-float group cursor-pointer transition-all duration-700 hover:scale-105 hover:opacity-100 hover:z-50 rotate-3 hover:rotate-0" style="animation-delay: 0.8s;">
        <div class="rounded-xl md:rounded-2xl p-1 md:p-2 bg-white/30 backdrop-blur-md border border-white/50 shadow-[0_15px_30px_-10px_rgba(0,0,0,0.15)] hover:shadow-[0_25px_50px_-12px_rgba(91,101,220,0.3)] transition-shadow duration-700">
          <div class="rounded-lg md:rounded-xl overflow-hidden border border-gray-100/50 bg-white">
            <img src="/assets/images/Screenshot 2026-06-27 222216.png" alt="System View" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>

      <!-- Bottom Left Image -->
      <div class="absolute z-10 w-[45%] sm:w-[40%] md:w-[35%] left-[5%] md:left-[15%] bottom-[0%] md:bottom-[5%] opacity-80 animate-float group cursor-pointer transition-all duration-700 hover:scale-105 hover:opacity-100 hover:z-50 -rotate-3 hover:rotate-0" style="animation-delay: 2s;">
        <div class="rounded-xl md:rounded-2xl p-1 md:p-2 bg-white/20 backdrop-blur-sm border border-white/40 shadow-[0_10px_20px_-5px_rgba(0,0,0,0.1)] hover:shadow-[0_25px_50px_-12px_rgba(235,122,68,0.3)] transition-shadow duration-700">
          <div class="rounded-lg md:rounded-xl overflow-hidden border border-gray-100/50 bg-white">
            <img src="/assets/images/Screenshot 2026-06-27 222240.png" alt="System View" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>

      <!-- Bottom Right Image -->
      <div class="absolute z-10 w-[45%] sm:w-[40%] md:w-[35%] right-[5%] md:right-[15%] bottom-[5%] md:bottom-[0%] opacity-80 animate-float group cursor-pointer transition-all duration-700 hover:scale-105 hover:opacity-100 hover:z-50 rotate-6 hover:rotate-0" style="animation-delay: 1.5s;">
        <div class="rounded-xl md:rounded-2xl p-1 md:p-2 bg-white/20 backdrop-blur-sm border border-white/40 shadow-[0_10px_20px_-5px_rgba(0,0,0,0.1)] hover:shadow-[0_25px_50px_-12px_rgba(91,101,220,0.3)] transition-shadow duration-700">
          <div class="rounded-lg md:rounded-xl overflow-hidden border border-gray-100/50 bg-white">
            <img src="/assets/images/Screenshot 2026-06-27 222300.png" alt="System View" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>
      
    </div>
  </section>

  <!-- 8. شريط التسجيل السريع (Blue CTA Banner) -->
  <section id="subscribe" class="relative bg-[#5B65DC] py-16 md:py-12 md:py-20 overflow-visible z-30">
    
    <!-- خطوط جمالية في الخلفية -->
    <div class="absolute inset-0 bg-[url('/assets/images/pattern-lines.png')] bg-cover opacity-10 pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      
      <!-- السهم الأصلي (الطيارة الورق) اللي بيتحرك مع السكرول -->
      <div 
        class="absolute left-0 -top-[110px] lg:-top-[150px] w-full z-20 hidden md:block pointer-events-none drop-shadow-2xl mix-blend-multiply transition-transform duration-75 ease-linear"
        [style.transform]="'translateY(' + planeOffset + 'px)'"
      >
        <!-- ضفنا -scale-x-100 عشان نعكس الطيارة وتيجي على الشمال وتطير ناحية الشمال (عشان العربي) -->
        <img src="/assets/images/Paper-Plan.png" alt="Paper Plane" class="w-full h-auto object-cover transform -scale-x-100">
      </div>

      <div class="row flex flex-col lg:flex-row items-center justify-between gap-10 position-relative z-10">
        
        <!-- العنوان (على اليمين) -->
        <div class="w-full lg:w-1/2 text-center lg:text-right">
          <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-white tracking-wide leading-tight">
            احصل على نسختك التجريبية المجانية من Algor Clinic الآن!
          </h2>
        </div>

        <!-- فورم الإيميل (على اليسار) -->
        <div class="w-full lg:w-1/2 flex justify-center lg:justify-end">
          <div class="w-full max-w-md relative">
            <form (ngSubmit)="startTrial()" class="relative w-full shadow-2xl rounded-lg">
              
              <!-- حقل إدخال الإيميل -->
              <input 
                type="email" 
                name="email" 
                [(ngModel)]="email"
                placeholder="أدخل بريدك الإلكتروني" 
                required
                class="w-full py-4 pr-6 pl-16 rounded-lg bg-white border border-transparent focus:border-[#EB7A44] focus:ring-2 focus:ring-[#EB7A44]/50 text-gray-800 placeholder-gray-400 outline-none transition-all duration-300 text-lg"
              >
              
              <!-- زرار الإرسال (أيقونة الرسالة) -->
              <button 
                type="submit" 
                aria-label="ابدأ التجربة المجانية" 
                class="absolute left-2 top-2 bottom-2 bg-transparent text-gray-400 hover:text-[#5B65DC] px-4 transition-colors duration-300 flex items-center justify-center cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
              </button>

            </form>
          </div>
        </div>

      </div>
    </div>
  </section>
